<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Галерея</title>
<style>
:root{--bg:#111114;--fg:#e6e6e9;--mut:#8a8a93;--card:#1b1b20;--line:#2a2a31}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif;padding:18px}
h1{font-size:18px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover,.btn.on{border-color:#7c4dff}
.btn.on{background:#7c4dff;color:#fff}
#q{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 10px;outline:none}
#count{color:var(--mut);font-size:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;position:relative}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.cell .nm{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);font-size:10px;padding:3px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cat{position:absolute;top:4px;left:4px;background:#7c4dff;font-size:9px;padding:1px 5px;border-radius:4px}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;align-items:center;justify-content:center;flex-direction:column}
#lb.open{display:flex}
#lb img,#lb video{max-width:92vw;max-height:84vh;border-radius:8px}
#lb .cap{color:var(--mut);margin-top:10px;font-size:13px}
#lb .close{position:absolute;top:16px;right:22px;font-size:30px;color:#fff;cursor:pointer}
.hint{color:var(--mut);font-size:13px;margin:30px 0}
</style></head><body>
<h1>🖼 Галерея</h1>
<div class="bar"><label class="btn">📂 Выбрать папку<input id="pick" type="file" webkitdirectory multiple hidden></label>
<input id="q" placeholder="поиск по имени…"><span id="count"></span></div>
<div class="bar" id="chips"></div>
<div id="grid"></div>
<div class="hint" id="hint">Нажми «Выбрать папку» и укажи свою папку Downloads (или любую с медиа). Превью появятся здесь. Фильтр по категориям — кнопки сверху.</div>
<div id="lb"><span class="close">×</span><div id="lbcontent"></div><div class="cap"></div></div>
<script src="gallery.js"></script></body></html>
